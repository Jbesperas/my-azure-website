<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Truths, One Lie</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

    <header>
        <div class="logo">🎭</div>

        <div>
            <h1>Two Truths, One Lie</h1>
            <p>Think you can spot the lie?</p>
	    <p>Made by John Benedict Esperas</p>
	    <p>Prof. Truly Enriquez</p>

        </div>
    </header>


    <main>

        <!-- CREATE GAME -->
        <section class="card create-card">

            <div class="section-title">
                <span>✏️</span>

                <div>
                    <h2>Create Your Game</h2>
                    <p>Give everyone three statements about you.</p>
                </div>
            </div>


            <form id="gameForm">

                <label>Your Name</label>

                <input
                    type="text"
                    id="playerName"
                    placeholder="Enter your name"
                    maxlength="30"
                    required
                >


                <label>Statement 1</label>

                <input
                    type="text"
                    id="statement1"
                    placeholder="Write something about yourself..."
                    maxlength="120"
                    required
                >


                <label>Statement 2</label>

                <input
                    type="text"
                    id="statement2"
                    placeholder="Write something about yourself..."
                    maxlength="120"
                    required
                >


                <label>Statement 3</label>

                <input
                    type="text"
                    id="statement3"
                    placeholder="Write something about yourself..."
                    maxlength="120"
                    required
                >


                <label>Which statement is the lie?</label>

                <div class="lie-options">

                    <label class="lie-option">
                        <input type="radio" name="lie" value="1" required>
                        <span>1</span>
                    </label>

                    <label class="lie-option">
                        <input type="radio" name="lie" value="2">
                        <span>2</span>
                    </label>

                    <label class="lie-option">
                        <input type="radio" name="lie" value="3">
                        <span>3</span>
                    </label>

                </div>


                <button type="submit" class="submit-btn">
                    🎭 Add My Game
                </button>

                <p id="status"></p>

            </form>

        </section>


        <!-- GAMES -->
        <section class="games-section">

            <div class="games-header">

                <div>
                    <h2>🎲 Guess the Lie</h2>
                    <p>Can you figure out which one isn't true?</p>
                </div>

                <button id="randomBtn" class="random-btn">
                    🎲 Random Game
                </button>

            </div>


            <div id="gamesContainer">

                <div class="loading">
                    Loading games...
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>Made for the class 🎭 • Two Truths, One Lie</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
